<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model and Layout Control</title>

    <link rel="stylesheet" href="Exercise8.css">
</head>
<body>

<h1>Community Events</h1>

<div class="eventCard">
    <h2>Tree Plantation Drive</h2>
    <p>Join us to make our city greener and cleaner.</p>
</div>

<div class="eventCard">
    <h2>Health Awareness Camp</h2>
    <p>Free health check-up and consultation.</p>
</div>

<h2>Registration Form</h2>

<form>
    <input type="text" placeholder="Enter Name">
    <br><br>

    <input type="email" placeholder="Enter Email">
</form>

<h2>Visibility Example</h2>

<p class="hiddenBox">
    This text uses visibility: hidden
</p>

<p class="noneBox">
    This text uses display: none
</p>

<p>
    This text remains visible for comparison.
</p>

</body>
</html>
