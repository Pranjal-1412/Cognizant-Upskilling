<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap JavaScript Plugins</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1 class="mb-4">Community Event Portal</h1>

    <button class="btn btn-primary"
            data-bs-toggle="collapse"
            data-bs-target="#eventInfo">
        Show Event Details
    </button>

    <div class="collapse mt-3" id="eventInfo">

        <div class="card card-body">

            Community Cultural Festival will be held on
            15th June at City Hall.

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
