<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex align-items-start border p-3">

        <img src="event.jpg"
             alt="Event"
             width="120"
             class="me-3 rounded">

        <div>

            <h4>Community Cultural Festival</h4>

            <p>
                The annual cultural festival includes music,
                dance performances, competitions and food stalls.
                Participants from different communities take part
                in the celebration.
            </p>

        </div>

    </div>

</div>

</body>
</html>
