<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card mx-auto" style="width: 22rem;">

        <img src="profile.jpg"
             class="card-img-top"
             alt="Profile Image">

        <div class="card-body">

            <h5 class="card-title">
                Rahul Sharma
            </h5>

            <p class="card-text">
                Event Coordinator responsible for managing
                community activities and registrations.
            </p>

            <a href="#" class="btn btn-primary">
                View Profile
            </a>

        </div>

    </div>

</div>

</body>
</html>
