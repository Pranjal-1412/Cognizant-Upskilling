<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Accordion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Frequently Asked Questions
    </h2>

    <div class="accordion" id="eventAccordion">

        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button"
                        data-bs-toggle="collapse"
                        data-bs-target="#item1">

                    What is the registration fee?

                </button>

            </h2>

            <div id="item1"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#eventAccordion">

                <div class="accordion-body">

                    Registration is completely free.

                </div>

            </div>

        </div>

        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#item2">

                    Who can participate?

                </button>

            </h2>

            <div id="item2"
                 class="accordion-collapse collapse"
                 data-bs-parent="#eventAccordion">

                <div class="accordion-body">

                    All community members can participate.

                </div>

            </div>

        </div>

        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#item3">

                    How do I register?

                </button>

            </h2>

            <div id="item3"
                 class="accordion-collapse collapse"
                 data-bs-parent="#eventAccordion">

                <div class="accordion-body">

                    Registration can be completed online through the portal.

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
