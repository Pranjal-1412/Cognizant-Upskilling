<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Colors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Community Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4 mb-3">
                Total Events
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-success text-white p-4 mb-3">
                Registrations
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-warning text-dark p-4 mb-3">
                Pending Requests
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-danger text-white p-4 mb-3">
                Cancelled Events
            </div>
        </div>

    </div>

</div>

</body>
</html>
