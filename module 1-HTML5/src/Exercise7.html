<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Video Invite</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        video{
            border: 3px solid black;
            border-radius: 10px;
        }

        #msg{
            color: green;
            font-weight: bold;
        }
    </style>

    <script>

        function videoReady(){
            document.getElementById("msg").innerHTML =
            "Video ready to play";
        }

        window.onbeforeunload = function(){
            return "Your form is not completed. Are you sure you want to leave?";
        };

    </script>

</head>
<body>

<h2>Community Event Invitation</h2>

<video width="500" controls oncanplay="videoReady()">
    <source src="event_video.mp4" type="video/mp4">
    Your browser does not support video.
</video>

<p id="msg"></p>

<br><br>

<h3>Quick Registration</h3>

<form>
    <input type="text" placeholder="Enter Your Name">
    <br><br>

    <input type="email" placeholder="Enter Email">
    <br><br>

    <button type="submit">Register</button>
</form>

</body>
</html>
